name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Bit-rot watch: a weekly run catches a Chromium or dependency drift while
  # the repo sleeps, instead of surprising the next real push.
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

# Only the tip of a branch matters on a sole-committer repo; superseded runs
# are cancelled rather than queued behind each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The native helper requires Swift 6; macos-15 images ship Xcode 16.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          swift --version

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Build extension and helper
        run: npm run build

      - name: Swift and native host tests
        run: npm run test:native

      - name: Node host conformance (same suite, Node port)
        run: npm run test:native:node

      - name: MCP server tests
        run: npm --prefix mcp ci && npm run test:mcp

      - name: Forbidden-capability and secret guards
        run: npm run guard:forbidden && npm run guard:secrets

      # Chrome end-to-end tests self-skip when no Playwright Chromium build is
      # present; install one so they run in CI too.
      - name: Install Chromium for e2e
        run: npx playwright-core install chromium || npx playwright install chromium || echo "chromium install unavailable; e2e will self-skip"

      - name: Chrome end-to-end tests
        run: npm run test:e2e

  # The npm package promises Windows and Linux. This job is that promise,
  # tested: the Node helper must pass the exact conformance suite the Swift
  # host passes, on the platforms that have no Swift host.
  node-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            observation: false
          # Windows is in observation mode until this leg has been seen green:
          # it has never run anywhere before, and blocking main on a platform
          # with zero prior runs would be gambling, not verification. Promote
          # by deleting the observation flag once it passes.
          - os: windows-latest
            observation: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.observation }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Node host conformance
        run: npm run test:native:node

      - name: MCP server tests
        run: npm --prefix mcp ci && npm run test:mcp
